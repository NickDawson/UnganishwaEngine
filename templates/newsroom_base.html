{% extends 'base.html' %}
{% block content %}
<main class="container newsroom">
  {% for message in get_flashed_messages() %}<p class="nr-notice" role="status">{{ message }}</p>{% endfor %}
  {% block newsroom_content %}{% endblock %}
</main>
<style>
.newsroom{padding-top:32px;padding-bottom:60px}.newsroom h1{font-size:42px;margin:10px 0}.nr-muted{color:var(--muted);line-height:1.6}.nr-head,.nr-actions{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.nr-card{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin:20px 0}.nr-filters,.nr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;align-items:end}.newsroom label{display:grid;gap:7px;font-size:13px;font-weight:700}.newsroom input:not([type=checkbox]),.newsroom select,.newsroom textarea{width:100%;padding:11px;border:1px solid #cad8d3;border-radius:7px;background:white;color:var(--ink);font:inherit}.newsroom textarea{min-height:120px}.nr-button,.newsroom button{display:inline-block;padding:11px 16px;border:1px solid var(--teal);border-radius:7px;background:var(--teal);color:white;font:700 13px 'DM Sans';cursor:pointer}.nr-button.secondary,.newsroom button.secondary{background:white;color:var(--teal)}.nr-table-wrap{overflow:auto}.nr-table{border-collapse:collapse;width:100%;font-size:13px}.nr-table th,.nr-table td{text-align:left;padding:17px 12px;border-bottom:1px solid var(--line);vertical-align:top}.nr-table th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}.nr-table td:first-child{min-width:260px}.nr-table td small{display:block;margin-top:7px;color:var(--muted)}.nr-pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eef3f0;font-size:11px;white-space:nowrap}.nr-pill.uncategorized{background:#fff3cf;color:#775919}.nr-pill.published{background:#ddf2e8;color:#16663f}.nr-pill.rejected{background:#ffe6e2;color:#963d31}.nr-notice{padding:14px;background:#e7f4eb;border:1px solid #bad7c4;border-radius:7px}.nr-checks{display:flex;flex-wrap:wrap;gap:12px;padding:12px 0}.nr-checks label{display:flex;align-items:center;font-weight:400}.nr-form{display:grid;gap:18px}.nr-story-copy{font-size:17px;line-height:1.7;white-space:pre-wrap}.nr-link{color:var(--teal);font-weight:700}.newsroom details summary{cursor:pointer;font-weight:700}.newsroom fieldset{border:1px solid var(--line);border-radius:8px;padding:14px}.newsroom legend{font-size:13px;font-weight:700}@media(max-width:650px){.newsroom h1{font-size:30px}.nr-card{padding:16px}.nr-filters{grid-template-columns:1fr 1fr}.nr-table td{padding:12px 8px}}
</style>
{% endblock %}
