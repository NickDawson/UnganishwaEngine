{% extends 'base.html' %} {% block content %}
<main class="container admin-shell">
  <div class="admin-card wide">
    <div class="eyebrow">Admin console</div>
    <div class="admin-header">
      <h1>Edit source</h1>
      <a class="logout-link" href="{{ url_for('admin_logout') }}">Logout</a>
    </div>
    {% if error %}
    <p class="error-box">{{ error }}</p>
    {% endif %} {% if source %}
    <form method="post" class="source-form">
      <div class="field-row">
        <label
          >Country
          <select name="country">
            {% for key, info in countries.items() %}
            <option value="{{ key }}" {% if key == source.country %}selected{% endif %}>
              {{ info.name }}
            </option>
            {% endfor %}
          </select>
        </label>
        <label
          >Topic
          <select name="topic">
            {% for topic in topics %}
            <option value="{{ topic }}" {% if topic == source.topic %}selected{% endif %}>
              {{ topic }}
            </option>
            {% endfor %}
          </select>
        </label>
      </div>
      <label
        >Source name
        <input
          type="text"
          name="source_name"
          value="{{ source.source_name }}"
          required
        />
      </label>
      <div class="field-row">
        <label
          >RSS feed URL
          <input
            type="url"
            name="feed_url"
            value="{{ source.feed_url or '' }}"
          />
        </label>
        <label
          >Site URL
          <input
            type="url"
            name="site_url"
            value="{{ source.site_url or '' }}"
            required
          />
        </label>
      </div>
      <label
        >Source type
        <select name="source_type">
          <option value="rss" {% if source.source_type == 'rss' %}selected{% endif %}>
            RSS feed
          </option>
          <option value="html" {% if source.source_type == 'html' %}selected{% endif %}>
            HTML crawl
          </option>
        </select>
      </label>
      <label class="toggle-row">
        <input
          type="checkbox"
          name="is_active"
          {%
          if
          source.is_active
          %}checked{%
          endif
          %}
        />
        Enabled in live source list
      </label>
      <div class="action-row">
        <button type="submit">Save changes</button>
        <a class="secondary-link" href="{{ url_for('admin_sources') }}"
          >Back to sources</a
        >
      </div>
    </form>
    {% else %}
    <p class="empty-note">This source could not be found.</p>
    {% endif %}
  </div>
</main>
<style>
  .admin-shell {
    padding-top: 40px;
    padding-bottom: 70px;
    display: flex;
    justify-content: center;
  }
  .admin-card {
    width: min(820px, 100%);
    background: white;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px;
  }
  .wide {
    max-width: 900px;
  }
  .admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .logout-link,
  .secondary-link {
    color: var(--teal);
    font-weight: 700;
  }
  .source-form {
    display: grid;
    gap: 14px;
    margin-top: 20px;
  }
  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .source-form label {
    display: grid;
    gap: 8px;
    font-weight: 700;
    color: var(--ink);
  }
  .source-form input,
  .source-form select {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 13px;
    font: 16px "DM Sans";
  }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .toggle-row input {
    width: 16px;
    height: 16px;
  }
  .action-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .source-form button {
    background: var(--teal);
    border: none;
    border-radius: 6px;
    color: white;
    font: 700 15px "DM Sans";
    padding: 12px 14px;
    cursor: pointer;
  }
  .error-box {
    background: #fff1f1;
    border: 1px solid #efb5b5;
    color: #7d2222;
    border-radius: 6px;
    padding: 10px 12px;
  }
  .empty-note {
    color: var(--muted);
  }
  @media (max-width: 760px) {
    .field-row {
      grid-template-columns: 1fr;
    }
    .action-row {
      flex-direction: column;
      align-items: flex-start;
    }
  }
</style>
{% endblock %}
