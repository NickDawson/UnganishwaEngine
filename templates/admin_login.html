{% extends 'base.html' %}

{% block content %}
<main class="container admin-shell">
    <div class="admin-card">
        <div class="eyebrow">Administrator access</div>
        <h1>Trusted source control</h1>
        <p class="intro">Only an administrator can approve and manage sources to keep the portal credible.</p>
        {% if error %}<p class="error-box">{{ error }}</p>{% endif %}
        <form method="post" class="admin-form">
            <label>Username
                <input type="text" name="username" value="admin" placeholder="Enter admin username" required>
            </label>
            <label>Password
                <input type="password" name="password" placeholder="Enter admin password" required>
            </label>
            <button type="submit">Access source manager</button>
        </form>
    </div>
</main>
<style>
    .admin-shell { padding-top:40px; padding-bottom:70px; display:flex; justify-content:center; }
    .admin-card { width:min(520px,100%); background:white; border:1px solid var(--line); border-radius:12px; padding:28px; }
    .admin-form { display:grid; gap:14px; margin-top:18px; }
    .admin-form label { display:grid; gap:8px; font-weight:700; color:var(--ink); }
    .admin-form input { border:1px solid var(--line); border-radius:6px; padding:12px 13px; font:16px 'DM Sans'; }
    .admin-form button { background:var(--teal); border:none; border-radius:6px; color:white; font:700 15px 'DM Sans'; padding:12px 14px; cursor:pointer; }
    .error-box { background:#fff1f1; border:1px solid #efb5b5; color:#7d2222; border-radius:6px; padding:10px 12px; }
</style>
{% endblock %}
