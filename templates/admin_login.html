{% extends 'admin_base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<main class="auth-shell">
  <section class="card auth-card" aria-labelledby="login-title">
    <div class="card-body">
      <a class="admin-brand" href="{{ url_for('index') }}"><span aria-hidden="true">U</span> Unganishwa</a>
      <h1 id="login-title">Newsroom sign in</h1>
      {% if error %}<p class="field-error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Username<input class="form-control" type="text" name="username" autocomplete="username" required></label>
        <label for="admin-password">Password</label>
        <div class="password-field">
          <input class="form-control" id="admin-password" type="password" name="password" autocomplete="current-password" required>
          <button type="button" class="btn btn-icon" data-password-toggle aria-controls="admin-password" aria-label="Show password" aria-pressed="false">◉</button>
        </div>
        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>
    </div>
  </section>
</main>
{% endblock %}
